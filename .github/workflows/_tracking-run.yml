        run: node --enable-source-maps artifacts/workflow/runtime/tracker-run.mjs run-stage --stage prepare-initial-pages --config "$TRACKING_CONFIG_PATH" --run-id "$TRACKING_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: deploy直前のstateと出力全fileを検証
        id: preflight
        if: steps.route.outputs.next_stage == 'preflight-initial-pages-deployment' || steps.prepare.outcome == 'success'
        env:
          TRACKING_CONFIG_PATH: ${{ inputs.config_path }}
          TRACKING_RUN_ID: ${{ steps.route.outputs.run_id }}
          TRACKING_RUN_SUFFIX: ${{ steps.route.outputs.run_suffix }}
        run: |
