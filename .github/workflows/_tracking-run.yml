        run: node --enable-source-maps artifacts/workflow/runtime/tracker-run.mjs run-stage --stage record-initial-pages-deployment --config "$TRACKING_CONFIG_PATH" --run-id "$TRACKING_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: 初回Pagesのreceiptと結果を保存
