        with:
          name: notification-history-pages-deployment-record
          path: artifacts/workflow/runs/${{ steps.route.outputs.run_suffix }}/notification-history-pages-deployment.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: 診断JSONLを暗号化
        if: always()
        env:
          VOICEVOX_TASK_TRACKER_DIAGNOSTICS_AES256_KEY_V1_B64: ${{ secrets.VOICEVOX_TASK_TRACKER_DIAGNOSTICS_AES256_KEY_V1_B64 }}
        run: |
          if [[ -f "$RUNNER_TEMP/voicevox-task-tracker-diagnostics-$GITHUB_JOB.jsonl" ]]; then
            .github/scripts/encrypt-diagnostics.sh artifacts/workflow/runtime/tracker-run.mjs
          fi
      - name: 暗号化済み診断artifactを保存
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/voicevox-task-tracker-diagnostics-${{ github.job }}.bundle
          if-no-files-found: ignore
          retention-days: 7
      - name: 公開失敗artifactを保存
        if: always()
        uses: ./.github/actions/upload-failure-artifact
        with:
          artifact-name: daily-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

  observe:
    needs:
      - quality
      - bootstrap
      - prepare-runtime
      - analyze
      - commit-initial-state
      - initial-pages
      - settle-notifications
      - finalize-run
      - notification-history-pages
      - complete
    if: always()
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/_tracking-observe.yml
    with:
      state_ref: ${{ inputs.state_ref }}
      effect_target: ${{ inputs.effect_target }}
      config_path: ${{ inputs.config_path }}
      quality_success: ${{ needs.quality.result == 'success' }}
      bootstrap_code_revision: ${{ needs.bootstrap.outputs.code_revision }}
      run_id: ${{ needs.complete.outputs.run_id || needs.bootstrap.outputs.run_id }}
      stage_results_json: ${{ toJSON(needs) }}
      has_failed_stage: ${{ contains(needs.*.result, 'failure') }}
      workflow_kind: daily
    secrets: inherit
