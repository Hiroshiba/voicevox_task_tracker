name: 日次タスク追跡

on:
  schedule:
    - cron: "0 23 * * *" # JSTでは翌日08:00
  workflow_dispatch:
    inputs:
      backfill:
        description: 追跡対象へ追加する範囲
        required: true
        default: none
        type: choice
        options:
          - none
          - linked
          - all-open
      repository_filter:
        description: backfill対象を限定するVOICEVOXリポジトリ名のカンマ区切り
        required: false
        type: string

permissions: {}

concurrency:
  group: voicevox-task-tracker-daily
  cancel-in-progress: false

jobs:
  test-eval:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: pnpmを準備
        run: corepack enable
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: 型を検査
        run: pnpm typecheck
      - name: lintを実行
        run: pnpm lint
      - name: formatを検査
        run: pnpm format:check
      - name: testを実行
        run: pnpm test
      - name: golden evalを実行
        run: pnpm eval:golden

  collect-analyze:
    needs: test-eval
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: 既存stateを取得
        run: |
          set +e
          git ls-remote --exit-code --heads origin tracker-state >/dev/null
          state_branch_status=$?
          set -e
          if [[ "$state_branch_status" -eq 0 ]]; then
            git fetch --no-tags origin refs/heads/tracker-state:refs/heads/tracker-state
          elif [[ "$state_branch_status" -ne 2 ]]; then
            exit "$state_branch_status"
          fi
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: pnpmを準備
        run: corepack enable
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: Codex CLIを確認
        run: pnpm exec codex --version
      - name: CLIをビルド
        run: pnpm build
      - name: 後続job用CLIをビルド
        run: pnpm build:workflow-cli
      - name: 収集と解析を実行
        env:
          BACKFILL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill || 'none' }}
          GH_APP_ID: ${{ vars.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPOSITORY_FILTER: ${{ inputs.repository_filter || '' }}
        run: |
          arguments=(collect-analyze --mode "$BACKFILL_MODE")
          if [[ -n "$REPOSITORY_FILTER" ]]; then
            IFS=',' read -r -a repositories <<< "$REPOSITORY_FILTER"
            for repository in "${repositories[@]}"; do
              arguments+=(--repository "$repository")
            done
          fi
          pnpm tracker:run "${arguments[@]}"
      - name: 公開可能なrun artifactを保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-public-run
          path: artifacts/workflow
          if-no-files-found: error
          retention-days: 1

  persist-state:
    needs: collect-analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: 既存stateを取得
        run: |
          set +e
          git ls-remote --exit-code --heads origin tracker-state >/dev/null
          state_branch_status=$?
          set -e
          if [[ "$state_branch_status" -eq 0 ]]; then
            git fetch --no-tags origin refs/heads/tracker-state:refs/heads/tracker-state
          elif [[ "$state_branch_status" -ne 2 ]]; then
            exit "$state_branch_status"
          fi
      - name: 公開可能なrun artifactを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-public-run
          path: artifacts/workflow
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: stateをtracker-stateへ保存
        run: node artifacts/workflow/runtime/tracker-run.mjs persist-state
      - name: tracker-stateを更新
        run: git push origin refs/heads/tracker-state:refs/heads/tracker-state

  build-pages:
    needs: persist-state
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: 保存済みstateを取得
        run: |
          set +e
          git ls-remote --exit-code --heads origin tracker-state >/dev/null
          state_branch_status=$?
          set -e
          if [[ "$state_branch_status" -eq 0 ]]; then
            git fetch --no-tags origin refs/heads/tracker-state:refs/heads/tracker-state
          elif [[ "$state_branch_status" -ne 2 ]]; then
            exit "$state_branch_status"
          fi
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: pnpmを準備
        run: corepack enable
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: 公開可能なrun artifactを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-public-run
          path: artifacts/workflow
      - name: Pages用データを生成
        run: node artifacts/workflow/runtime/tracker-run.mjs build-pages --output web/public/data
      - name: Pagesをビルド
        run: pnpm build:web
      - name: Pagesを構成
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Pages artifactを保存
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/web

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pagesへdeploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  notify-discord:
    needs:
      - collect-analyze
      - deploy-pages
    if: >-
      success() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: 既存stateを取得
        run: git fetch --no-tags origin refs/heads/tracker-state:refs/heads/tracker-state
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
      - name: 公開可能なrun artifactを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-public-run
          path: artifacts/workflow
      - name: Discordへ通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGES_URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: >-
          node artifacts/workflow/runtime/tracker-run.mjs notify-discord
          --pages-url "$PAGES_URL"
      - name: 通知ledgerを更新
        run: git push origin refs/heads/tracker-state:refs/heads/tracker-state

  notify-operations:
    needs:
      - collect-analyze
      - build-pages
      - deploy-pages
    if: >-
      always() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.collect-analyze.result == 'failure' ||
      needs.build-pages.result == 'failure' ||
      needs.deploy-pages.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: 既存stateを取得
        run: git fetch --no-tags origin refs/heads/tracker-state:refs/heads/tracker-state
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: pnpmを準備
        run: corepack enable
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: CLIをビルド
        run: pnpm build
      - name: 運用障害をDiscordへ通知
        env:
          DISCORD_OPERATIONS_WEBHOOK_URL: ${{ secrets.DISCORD_OPERATIONS_WEBHOOK_URL }}
          INCIDENT_ID: ${{ github.run_id }}
          COLLECTION_RESULT: ${{ needs.collect-analyze.result }}
        run: |
          incident_kind=pages
          if [[ "$COLLECTION_RESULT" == "failure" ]]; then
            incident_kind=collection
          fi
          occurred_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          pnpm tracker:run notify-operations \
            --kind "$incident_kind" \
            --incident-id "$INCIDENT_ID:$incident_kind" \
            --occurred-at "$occurred_at"
      - name: 通知ledgerを更新
        run: git push origin refs/heads/tracker-state:refs/heads/tracker-state
