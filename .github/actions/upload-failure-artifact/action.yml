name: 公開失敗artifactを保存
description: CLIが出した公開失敗artifactをjobごとに保存する
inputs:
  artifact-name:
    description: 保存先artifact名
    required: true
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: artifacts/workflow/failures/*.json
        if-no-files-found: ignore
        retention-days: 7
