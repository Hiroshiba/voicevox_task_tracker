name: 保存済み通知履歴Pages公開結果を取得
description: Actions一覧で前回結果の不在を確定し、存在する結果を取得する
inputs:
  run-id:
    description: Actions run ID
    required: true
  github-token:
    description: Actions artifactの読取token
    required: true
  output-path:
    description: 取得した結果の保存先
    required: false
    default: artifacts/workflow/previous/notification-history-pages-deployment.json
outputs:
  status:
    description: 前回結果の取得状態
    value: ${{ steps.download.outputs.status }}
runs:
  using: composite
  steps:
    - name: 前回結果を照会して取得
      id: download
      shell: bash
      env:
        ACTIONS_READ_TOKEN: ${{ inputs.github-token }}
        PRIOR_OUTCOME_RUN_ID: ${{ inputs.run-id }}
        PRIOR_OUTCOME_PATH: ${{ inputs.output-path }}
      run: node "$GITHUB_ACTION_PATH/download.mjs"
